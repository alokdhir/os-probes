[collect]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/probes/collect.py
parameters:
type:script
message:probes: read new firewall log lines

[query]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/probes/query.py
parameters:%s %s %s %s %s %s %s
type:script_output
cache_ttl:60
message:probes query %s %s
